<style>
:root{
  color-scheme: light;
  --surface-1:#fcfcfb; --plane:#f4f4f1; --card:#ffffff;
  --text-primary:#0b0b0b; --text-secondary:#52514e; --muted:#898781;
  --grid:#e1e0d9; --axis:#c3c2b7; --border:rgba(11,11,11,.10);
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4;
  --good:#0ca30c; --warning:#fab219; --serious:#ec835a; --critical:#d03b3b;
  --good-ink:#006300; --warn-ink:#8a5a00; --crit-ink:#a52424;
  --accent:#2a78d6;
}
@media (prefers-color-scheme: dark){
  :root:where(:not([data-theme="light"])){
    color-scheme: dark;
    --surface-1:#1a1a19; --plane:#0d0d0d; --card:#1a1a19;
    --text-primary:#ffffff; --text-secondary:#c3c2b7; --muted:#898781;
    --grid:#2c2c2a; --axis:#383835; --border:rgba(255,255,255,.10);
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181;
    --good-ink:#0ca30c; --warn-ink:#fab219; --crit-ink:#e66767;
    --accent:#3987e5;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --surface-1:#1a1a19; --plane:#0d0d0d; --card:#1a1a19;
  --text-primary:#ffffff; --text-secondary:#c3c2b7; --muted:#898781;
  --grid:#2c2c2a; --axis:#383835; --border:rgba(255,255,255,.10);
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181;
  --good-ink:#0ca30c; --warn-ink:#fab219; --crit-ink:#e66767;
  --accent:#3987e5;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--plane); color:var(--text-primary);
  font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;
  overscroll-behavior-y:none;
}
#app{padding:0 16px calc(84px + env(safe-area-inset-bottom));max-width:640px;margin:0 auto}
header.top{padding:calc(14px + env(safe-area-inset-top)) 0 10px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
header.top h1{font-size:26px;line-height:1.1;margin:0;letter-spacing:-.02em}
header.top .sub{color:var(--text-secondary);font-size:13px;margin-top:2px}
.iconbtn{border:1px solid var(--border);background:var(--card);color:var(--text-secondary);
  width:38px;height:38px;border-radius:12px;font-size:16px;display:grid;place-items:center;cursor:pointer;flex:none}

.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:14px;margin:0 0 12px}
.card h2{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 10px;font-weight:600}
.card h3{font-size:17px;margin:0 0 4px;letter-spacing:-.01em}
.row{display:flex;gap:10px}
.muted{color:var(--muted)} .sec{color:var(--text-secondary)}
.small{font-size:13px} .tiny{font-size:11.5px}
.num{font-variant-numeric:tabular-nums}

/* hero */
.hero{display:flex;align-items:baseline;gap:8px}
.hero .v{font-size:40px;font-weight:600;letter-spacing:-.03em;line-height:1}
.hero .u{font-size:14px;color:var(--text-secondary)}

/* status pill */
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 10px;font-size:12.5px;font-weight:600;border:1px solid var(--border)}
.pill .dot{width:8px;height:8px;border-radius:50%;flex:none}
.pill.good{color:var(--good-ink)} .pill.good .dot{background:var(--good)}
.pill.warn{color:var(--warn-ink)} .pill.warn .dot{background:var(--warning)}
.pill.crit{color:var(--crit-ink)} .pill.crit .dot{background:var(--critical)}
.pill.neutral{color:var(--text-secondary)} .pill.neutral .dot{background:var(--axis)}

/* tiles */
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.tile{background:var(--surface-1);border:1px solid var(--border);border-radius:13px;padding:11px 12px}
.tile .k{font-size:11.5px;color:var(--muted);letter-spacing:.03em}
.tile .v{font-size:23px;font-weight:600;letter-spacing:-.02em;margin-top:2px}
.tile .n{font-size:11.5px;color:var(--text-secondary);margin-top:1px}

/* session */
.session{border-left:3px solid var(--accent);padding-left:12px}
.session.rest{border-color:var(--axis)}
.badge{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;
  color:var(--muted);border:1px solid var(--border);border-radius:6px;padding:2px 6px}

/* zone bar */
.zonebar{position:relative;height:26px;border-radius:8px;overflow:hidden;background:var(--surface-1);border:1px solid var(--border);margin-top:8px}
.zonebar .seg{position:absolute;top:0;bottom:0}
.zonebar .target{position:absolute;top:0;bottom:0;border-left:2px solid var(--text-primary);border-right:2px solid var(--text-primary);background:rgba(127,127,127,.14)}
.zonebar .mark{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--text-primary)}
.zonescale{display:flex;justify-content:space-between;margin-top:3px}

/* blokken */
.blocks{display:flex;flex-wrap:wrap;gap:7px;margin-top:9px}
.blk{flex:1 1 84px;min-width:84px;border:1px solid var(--border);border-radius:11px;padding:7px 9px;background:var(--surface-1)}
.blk .bn{display:block;font-size:10.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.blk .bh{font-size:21px;font-weight:600;letter-spacing:-.02em}
.blk .bt{display:block;margin-top:-1px}
.blk.good{border-color:color-mix(in srgb,var(--good) 45%,transparent)} .blk.good .bt{color:var(--good-ink)}
.blk.warn{border-color:color-mix(in srgb,var(--warning) 55%,transparent)} .blk.warn .bt{color:var(--warn-ink)}
.blk.crit{border-color:color-mix(in srgb,var(--critical) 45%,transparent)} .blk.crit .bt{color:var(--crit-ink)}
.warnrow{color:var(--warn-ink)}

/* list */
.item{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--grid)}
.item:first-child{border-top:0}
.item .st{width:20px;flex:none;text-align:center;font-size:14px;line-height:1.4}
.item .body{flex:1;min-width:0}
.item .t{font-size:14.5px;font-weight:500}
.item .d{font-size:12.5px;color:var(--text-secondary);margin-top:1px}
.item .r{font-size:12.5px;color:var(--muted);text-align:right;flex:none;white-space:nowrap}

/* weeks */
.wk{border:1px solid var(--border);border-radius:14px;margin-bottom:10px;overflow:hidden;background:var(--card)}
.wk>summary{list-style:none;cursor:pointer;padding:12px 14px;display:flex;align-items:center;gap:10px}
.wk>summary::-webkit-details-marker{display:none}
.wk>summary .wt{flex:1;font-weight:600;font-size:15px}
.wk .inner{padding:0 14px 12px}
.wk.now{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}

/* tabs */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;
  background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:saturate(180%) blur(20px);
  border-top:1px solid var(--border);display:flex;padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
nav.tabs button{flex:1;background:none;border:0;color:var(--muted);font:inherit;font-size:10.5px;font-weight:600;
  padding:6px 2px;display:grid;gap:2px;justify-items:center;cursor:pointer;letter-spacing:.02em}
nav.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-current="true"]{color:var(--accent)}

/* chart */
svg.chart{display:block;width:100%;height:auto;overflow:visible}
.tt{position:fixed;z-index:60;pointer-events:none;background:var(--card);border:1px solid var(--border);
  border-radius:10px;padding:7px 9px;font-size:12.5px;box-shadow:0 6px 24px rgba(0,0,0,.16);opacity:0;transition:opacity .12s}
.tt.on{opacity:1}
.legend{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--text-secondary)}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.tblbtn{background:none;border:0;color:var(--muted);font:inherit;font-size:11.5px;cursor:pointer;padding:4px 0;text-decoration:underline}
table.dt{width:100%;border-collapse:collapse;font-size:12.5px;font-variant-numeric:tabular-nums;margin-top:6px}
table.dt th,table.dt td{text-align:right;padding:4px 6px;border-bottom:1px solid var(--grid)}
table.dt th:first-child,table.dt td:first-child{text-align:left}
table.dt th{color:var(--muted);font-weight:600;font-size:11.5px}

/* sheet */
.sheet{position:fixed;inset:0;z-index:50;display:none}
.sheet.on{display:block}
.sheet .bg{position:absolute;inset:0;background:rgba(0,0,0,.42)}
.sheet .panel{position:absolute;left:0;right:0;bottom:0;background:var(--plane);border-radius:20px 20px 0 0;
  padding:18px 16px calc(20px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto;max-width:640px;margin:0 auto}
.sheet h2{font-size:19px;margin:0 0 12px;text-transform:none;letter-spacing:-.01em;color:var(--text-primary)}
label.f{display:block;margin:10px 0 0;font-size:12.5px;color:var(--text-secondary)}
input.f,select.f{width:100%;margin-top:4px;padding:10px 12px;border-radius:11px;border:1px solid var(--border);
  background:var(--card);color:var(--text-primary);font:inherit;font-size:16px}
button.btn{width:100%;margin-top:14px;padding:12px;border-radius:12px;border:0;background:var(--accent);color:#fff;
  font:inherit;font-weight:600;font-size:15px;cursor:pointer}
button.btn.ghost{background:transparent;color:var(--text-secondary);border:1px solid var(--border)}
.note{font-size:12.5px;color:var(--text-secondary);background:var(--surface-1);border:1px solid var(--border);
  border-radius:11px;padding:10px 12px;margin-top:12px}
.seg{display:flex;gap:6px;background:var(--surface-1);border:1px solid var(--border);border-radius:11px;padding:3px}
.seg button{flex:1;border:0;background:none;color:var(--text-secondary);font:inherit;font-size:13px;padding:7px;border-radius:8px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--text-primary);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.10)}
hr.sep{border:0;border-top:1px solid var(--grid);margin:14px 0}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div>
      <h1 id="ttl">Vandaag</h1>
      <div class="sub" id="sub"></div>
    </div>
    <button class="iconbtn" id="settingsBtn" aria-label="Instellingen">⚙</button>
  </header>
  <main id="view"></main>
</div>

<nav class="tabs" id="tabs"></nav>
<div class="tt" id="tt"></div>

<div class="sheet" id="sheet">
  <div class="bg" data-close></div>

<script>
"use strict";
const DATA = JSON.parse(document.getElementById('seed').textContent);
const LS = {
  get(k,d){ try{ const v=localStorage.getItem('koers.'+k); return v==null?d:JSON.parse(v);}catch(e){return d;} },
  set(k,v){ try{ localStorage.setItem('koers.'+k, JSON.stringify(v)); }catch(e){} },
  del(k){ try{ localStorage.removeItem('koers.'+k);}catch(e){} }
};

/* ---------- helpers ---------- */
const TODAY = new Date();
const iso = d => new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
const TODAY_ISO = iso(TODAY);
const DAYS=['zo','ma','di','wo','do','vr','za'];
const MONTHS=['jan','feb','mrt','apr','mei','jun','jul','aug','sep','okt','nov','dec'];
const parse = s => { const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); };
const fmtDate = s => { const d=parse(s); return DAYS[d.getDay()]+' '+d.getDate()+' '+MONTHS[d.getMonth()]; };
const dayDiff = (a,b) => Math.round((parse(a)-parse(b))/864e5);
const pace = (m,s) => { if(!m||!s) return '–'; const p=s/(m/1000); return Math.floor(p/60)+':'+String(Math.round(p%60)).padStart(2,'0'); };
const paceSec = (m,s) => (!m||!s)?null:s/(m/1000);
const hms = s => { s=Math.round(s); const h=Math.floor(s/3600), m=Math.floor(s%3600/60);
  return h? h+':'+String(m).padStart(2,'0')+':'+String(s%60).padStart(2,'0') : m+':'+String(s%60).padStart(2,'0'); };
const km = m => (m/1000).toFixed(1).replace('.',',');
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function allActs(){
  const extra = LS.get('live', []), laps = LS.get('laps', {});
  const byId = new Map();
  DATA.activities.forEach(a=>byId.set(a.id,a));
  extra.forEach(a=>{
    const prev = byId.get(a.id)||{};
    const merged = Object.assign({}, prev, a);
    // de samenvatting van Strava bevat geen ronden — die worden apart opgehaald
    if(!merged.laps && prev.laps) merged.laps = prev.laps;
    if(laps[a.id]) merged.laps = laps[a.id];
    byId.set(a.id, merged);
  });
  return [...byId.values()].sort((a,b)=> a.date<b.date?1:a.date>b.date?-1:0);
}
const runsOf = as => as.filter(a=>a.sport==='Run');

/* ---------- belasting / ACWR ---------- */
function load(as, ref){
  const end = ref||TODAY_ISO;
  const sum = n => as.filter(a=>{const d=dayDiff(end,a.date); return d>=0 && d<n;})
                    .reduce((s,a)=> s+(a.effort||0), 0);
  const acute = sum(7), chronic28 = sum(28)/4;
  return { acute, chronic: chronic28, acwr: chronic28>0 ? acute/chronic28 : null };
}
function acwrVerdict(r){
  if(r==null) return {cls:'neutral',label:'geen basis',txt:'Nog te weinig historie om een verhouding te berekenen.'};
  if(r<0.8)  return {cls:'warn',label:'onderbelast',txt:'Je week ligt duidelijk onder je eigen basis. In een opbouwblok is dat verlies.'};
  if(r<=1.3) return {cls:'good',label:'in balans',txt:'Acute belasting past bij je basis. Dit is de zone waarin opbouwen veilig gaat.'};
  if(r<=1.5) return {cls:'warn',label:'aan de hoge kant',txt:'Je bouwt sneller op dan je basis meegroeit. Houd de zaterdagintensiteit in de gaten.'};
  return {cls:'crit',label:'te snel opgebouwd',txt:'Dit is het patroon van begin augustus. Bij klachten: schrap de zaterdagintensiteit, niet de zondagse duurloop.'};
}

/* ---------- schema-matching ---------- */
function planWithActual(){
  const rs = runsOf(allActs());
  return DATA.plan.map(p=>{
    const act = rs.find(a=>a.date===p.date);
    return Object.assign({}, p, {act, status: act?'done':(p.date<TODAY_ISO?'missed':(p.date===TODAY_ISO?'today':'todo'))});
  });
}
function weekAgg(){
  const rs = runsOf(allActs());
  return DATA.weeks.map(w=>{
    const inw = rs.filter(a=>a.date>=w.from && a.date<=w.to);
    return {w, done: inw.reduce((s,a)=>s+a.dist_m,0)/1000, n:inw.length, acts:inw};
  });
}
function currentWeek(){ return DATA.weeks.find(w=>TODAY_ISO>=w.from && TODAY_ISO<=w.to) || DATA.weeks[0]; }

/* ---------- drift · één definitie, gebruikt in app én in de analyses ----------
   Twee helften van de loop, tijdgewogen. Twee getallen uit dezelfde splitsing:
     · bpm  = hartslag tweede helft minus eerste helft
     · ontk = ontkoppeling in %, oftewel hoeveel de verhouding snelheid/hartslag
              verslechtert tussen de helften. Onder 5% is normaal.
   Waarom niet eerste tegen laatste kilometer: kilometer 1 zit nog in de opwarmramp
   vanaf rusthartslag en is structureel te laag, wat het verschil kunstmatig opblaast.
   Toelating: hardlopen, minimaal 8 km, onder 80 hoogtemeters, gemiddelde hartslag
   onder 157, en de twee helften minder dan 4% in tempo uit elkaar. Buiten die
   voorwaarden is drift geen bruikbaar getal en toont de app niets. */
const DRIFT = {minKm:8, maxElev:80, maxHr:157, maxPaceGap:0.04, maxSpread:25, minLap:120, minCover:0.8, warn:5};

function drift(a){
  if(a.sport!=='Run' || !a.laps) return null;
  if(a.dist_m < DRIFT.minKm*1000) return null;
  if((a.elev_m||0) >= DRIFT.maxElev) return null;
  if(!a.hr || a.hr >= DRIFT.maxHr) return null;

  // Alleen ronden van minimaal twee minuten. Zo vallen strides en korte versnellingen
  // eruit zonder de hele duurloop te verwerpen — een rustige loop met zes strides aan
  // het eind blijft bruikbaar, de strides tellen alleen niet mee.
  const L = a.laps.filter(l=>l.hr && l.t>=DRIFT.minLap && l.d>=50);
  if(L.length<6) return null;

  // Wat dan nog steeds sterk schommelt is een intervaltraining: daar meet je het
  // trainingsschema in plaats van drift.
  const hrs = L.map(l=>l.hr);
  if(Math.max(...hrs) - Math.min(...hrs) > DRIFT.maxSpread) return null;

  // De overgebleven ronden moeten wél de loop zijn. Bij een intervalsessie blijven na
  // het wegfilteren alleen warming-up en cooldown over; drift daartussen meten zegt niets.
  const kept = L.reduce((s,l)=>s+l.t,0);
  if(kept < a.moving_s * DRIFT.minCover) return null;

  const tot = L.reduce((s,l)=>s+l.t,0), half = tot/2;
  const A=[], B=[]; let acc=0;
  L.forEach(l=>{ (acc + l.t/2 <= half ? A : B).push(l); acc += l.t; });
  if(A.length<2 || B.length<2) return null;

  const agg = X => {
    const t = X.reduce((s,l)=>s+l.t,0), d = X.reduce((s,l)=>s+l.d,0);
    return {t, d, hr: X.reduce((s,l)=>s+l.hr*l.t,0)/t, v: d/t};
  };
  const x = agg(A), y = agg(B);
  if(Math.abs(x.v-y.v)/x.v > DRIFT.maxPaceGap) return null;   // geen gelijkmatige loop

  const r1 = x.v/x.hr, r2 = y.v/y.hr;
  return {
    bpm: Math.round(y.hr - x.hr),
    ontk: Math.round((r1-r2)/r1*1000)/10,
    hr1: Math.round(x.hr), hr2: Math.round(y.hr),
    p1: pace(x.d, x.t), p2: pace(y.d, y.t)
  };
}
/* Haalde hij de doelband in de wérkblokken? Het sessiegemiddelde zegt hier niets:
   warming-up, dribbelherstel en cooldown drukken het omlaag. Daarom worden de blokken
   zelf opgezocht — ronden met ongeveer de geplande duur — en per blok beoordeeld. */
function blockCheck(p, a){
  const spec = p.blocks;
  if(!a || !a.laps || !spec) return null;
  const band = spec.band || p.band;
  const [lo,hi] = band.split('-').map(Number);
  const L = a.laps.filter(l=>l.hr);
  if(!L.length) return null;

  let picked;
  if(spec.tail){
    // tempo-afsluiting: de laatste n hele kilometers, een aangebroken slotronde telt niet mee
    const full = L.filter(l=>l.d>=700);
    picked = (full.length>=spec.n?full:L).slice(-spec.n).map(l=>[l]);
  } else {
    // Het horloge legt automatische kilometerronden vast, dus een blok van 12 minuten is
    // geen enkele ronde maar een reeks. Daarom worden aaneengesloten ronden met verhoogde
    // hartslag samengevoegd tot groepen; dribbelherstel valt eronder en breekt de reeks,
    // warming-up en cooldown vormen geen groep. Van de groepen blijven de n langste over.
    const thr = lo - 10;
    const groups = [];
    let cur = null;
    L.forEach(l=>{
      if(l.hr>=thr && l.t>=15){ (cur = cur||groups[groups.push([])-1]).push(l); }
      else { cur = null; }
    });
    const min = Math.max(spec.sec*0.4, 30);
    let g = groups.filter(x=>x.reduce((s,l)=>s+l.t,0)>=min);
    if(!g.length) g = groups;
    if(!g.length) return null;
    picked = g.map((x,i)=>({x,i}))
      .sort((a,b)=> b.x.reduce((s,l)=>s+l.t,0) - a.x.reduce((s,l)=>s+l.t,0))
      .slice(0,spec.n).sort((a,b)=>a.i-b.i).map(o=>o.x);
  }
  const blocks = picked.map((g,i)=>{
    const t = g.reduce((s,l)=>s+l.t,0), d = g.reduce((s,l)=>s+l.d,0);
    const h = g.reduce((s,l)=>s+l.hr*l.t,0)/t;   // tijdgewogen, niet het gemiddelde van gemiddelden
    return {n:i+1, hr:Math.round(h), t, d,
      ok: h>=lo-2 && h<=hi+2,
      dir: h>hi+2 ? 'hoog' : (h<lo-2 ? 'laag' : 'ok')};
  });
  return {blocks, lo, hi, label:spec.label,
          hit:blocks.filter(b=>b.ok).length, total:blocks.length,
          found: blocks.length===spec.n};
}

/* ---------- SVG chart helpers ---------- */
function svg(w,h,inner,cls){ return `<svg class="chart ${cls||''}" viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMid meet" role="img">${inner}</svg>`; }
function barChart(rows, opt){
  opt = opt||{};
  const W=340, H=opt.h||150, PL=34, PR=8, PT=8, PB=22;
  const max = opt.max || Math.max(...rows.flatMap(r=>[r.a||0,r.b||0])) * 1.1 || 1;
  const iw = W-PL-PR, ih = H-PT-PB;
  const bw = iw/rows.length;
  const y = v => PT+ih - (v/max)*ih;
  let g='';
  const ticks = opt.ticks || 3;
  for(let i=0;i<=ticks;i++){ const v=max*i/ticks, yy=y(v);
    g += `<line x1="${PL}" x2="${W-PR}" y1="${yy}" y2="${yy}" stroke="var(--grid)" stroke-width="1"/>`+
         `<text x="${PL-6}" y="${yy+3.5}" text-anchor="end" font-size="9.5" fill="var(--muted)">${Math.round(v)}</text>`; }
  rows.forEach((r,i)=>{
    const x0 = PL + i*bw;
    if(opt.dual){
      const w2 = Math.min(13,(bw-8)/2);
      const xa = x0+bw/2-w2-1, xb=x0+bw/2+1;
      if(r.b) g += rect(xa, y(r.b), w2, PT+ih-y(r.b), 'var(--axis)', r.tipB);
      if(r.a) g += rect(xb, y(r.a), w2, PT+ih-y(r.a), r.color||'var(--s1)', r.tipA);
    } else {
      const w2 = Math.min(24, bw-8);
      g += rect(x0+bw/2-w2/2, y(r.a), w2, PT+ih-y(r.a), r.color||'var(--s1)', r.tipA);
    }
    g += `<text x="${x0+bw/2}" y="${H-7}" text-anchor="middle" font-size="9.5" fill="var(--muted)">${esc(r.label)}</text>`;
  });
  g += `<line x1="${PL}" x2="${W-PR}" y1="${PT+ih}" y2="${PT+ih}" stroke="var(--axis)" stroke-width="1"/>`;
  return svg(W,H,g);
}
function rect(x,y,w,h,fill,tip){
  h = Math.max(h,1.5);
  return `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${w.toFixed(1)}" height="${h.toFixed(1)}" rx="4" ry="4" fill="${fill}" ${tip?`data-tip="${esc(tip)}"`:''}/>`;
}
function lineChart(series, opt){
  opt=opt||{};
  const W=340,H=opt.h||160,PL=30,PR=10,PT=10,PB=22;
  const iw=W-PL-PR, ih=H-PT-PB;
  const xs = series[0].pts.length;
  const allv = series.flatMap(s=>s.pts.map(p=>p.v));
  const lo = opt.min!=null?opt.min:Math.min(...allv), hi = opt.max!=null?opt.max:Math.max(...allv);
  const x = i => PL + (xs<2?iw/2:(i/(xs-1))*iw);
  const y = v => PT+ih - ((v-lo)/((hi-lo)||1))*ih;
  let g='';
  for(let i=0;i<=3;i++){ const v=lo+(hi-lo)*i/3, yy=y(v);
    g+=`<line x1="${PL}" x2="${W-PR}" y1="${yy}" y2="${yy}" stroke="var(--grid)"/>`+
       `<text x="${PL-5}" y="${yy+3.5}" text-anchor="end" font-size="9.5" fill="var(--muted)">${opt.fmtY?opt.fmtY(v):Math.round(v)}</text>`; }
  series.forEach(s=>{
    const d = s.pts.map((p,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(p.v).toFixed(1)).join(' ');
    g+=`<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>`;
    s.pts.forEach((p,i)=>{ g+=`<circle cx="${x(i).toFixed(1)}" cy="${y(p.v).toFixed(1)}" r="3.6" fill="${s.color}" stroke="var(--card)" stroke-width="2" data-tip="${esc(p.tip||'')}"/>`; });
  });
  series[0].pts.forEach((p,i)=>{ if(p.label) g+=`<text x="${x(i)}" y="${H-6}" text-anchor="middle" font-size="9" fill="var(--muted)">${esc(p.label)}</text>`; });
  if(opt.ref!=null && opt.ref>=lo && opt.ref<=hi){
    const yy=y(opt.ref);
    g+=`<line x1="${PL}" x2="${W-PR}" y1="${yy}" y2="${yy}" stroke="var(--text-secondary)" stroke-width="1.5" stroke-dasharray="3 4"/>`+
       `<text x="${W-PR}" y="${yy-5}" text-anchor="end" font-size="9" fill="var(--text-secondary)">${esc(opt.refLabel||'')}</text>`;
  }
  return svg(W,H,g);
}
function stackBar(parts, h){
  h=h||18; let x=0, g='';
  const tot = parts.reduce((s,p)=>s+p.v,0)||1;
  parts.forEach((p,i)=>{ const w=(p.v/tot)*340; if(w<=0) return;
    g+=`<rect x="${x+ (i? 1:0)}" y="0" width="${Math.max(w-(i?1:0)-1,0.5)}" height="${h}" rx="3" fill="${p.color}" data-tip="${esc(p.tip||'')}"/>`; x+=w; });
  return svg(340,h,g);
}

function progressBar(done, goal){
  const pct = Math.min(done/goal,1.35);
  const over = done>goal;
  return `<div style="margin-top:10px;height:8px;border-radius:99px;background:var(--surface-1);border:1px solid var(--border);overflow:hidden">
    <div style="height:100%;width:${(Math.min(pct,1)*100).toFixed(0)}%;background:${over?'var(--good)':'var(--accent)'};border-radius:99px"></div></div>`;
}

function zoneBar(band, marks){
  marks = (marks==null?[]:[].concat(marks)).filter(v=>v);
  const [lo,hi] = band.split('-').map(Number);
  const LO=110, HI=192, span=HI-LO;
  const pos = v => ((Math.min(Math.max(v,LO),HI)-LO)/span*100);
  const cols=['var(--s3)','var(--s1)','var(--s4)','var(--s2)','var(--s5)'];
  let segs = DATA.zones.map((z,i)=>{
    const a=pos(Math.max(z.lo,LO)), b=pos(Math.min(z.hi,HI));
    return `<div class="seg" style="left:${a}%;width:${(b-a)}%;background:${cols[i]};opacity:.30"></div>`;
  }).join('');
  segs += `<div class="target" style="left:${pos(lo)}%;width:${pos(hi)-pos(lo)}%"></div>`;
  marks.forEach(m=>{ segs += `<div class="mark" style="left:${pos(m)}%" data-tip="${m} bpm"></div>`; });
  return `<div class="zonebar">${segs}</div>
    <div class="zonescale tiny muted num"><span>110</span><span>145</span><span>161</span><span>180</span><span>190</span></div>`;
}

function sessionBlock(p, big){
  const a = p.act;
  const st = p.status;
  const icon = st==='done'?'✓':st==='missed'?'○':st==='today'?'●':'○';
  let h = `<div class="session${p.title.startsWith('Rust')?' rest':''}">
    <div class="row" style="justify-content:space-between;align-items:center">
      <span class="badge">${p.day} ${parse(p.date).getDate()} ${MONTHS[parse(p.date).getMonth()]}</span>
      ${st==='done'?'<span class="pill good"><span class="dot"></span>gedaan</span>':
        st==='missed'?'<span class="pill warn"><span class="dot"></span>niet gelogd</span>':
        st==='today'?'<span class="pill neutral"><span class="dot"></span>vandaag</span>':''}
    </div>
    <h3 style="margin-top:6px">${esc(p.title)}</h3>
    <p class="small sec" style="margin:2px 0 0">${esc(p.detail)}</p>`;
  const bc = a ? blockCheck(p, a) : null;
  const isQuality = !!p.blocks;

  if(big!==false){
    const band = (p.blocks && p.blocks.band) || p.band;
    h += `<div class="small muted" style="margin-top:10px">Doelhartslag ${isQuality?'in de blokken':''} <strong class="num" style="color:var(--text-primary)">${band.replace('-','–')} bpm</strong></div>`;
    h += zoneBar(band, bc ? bc.blocks.map(b=>b.hr) : (!isQuality && a && a.hr ? [Math.round(a.hr)] : []));
  }

  if(a){
    h += `<div class="small sec" style="margin-top:10px">${esc(a.name)} — ${km(a.dist_m)} km · ${hms(a.moving_s)} · ${pace(a.dist_m,a.moving_s)}/km</div>`;

    if(isQuality){
      if(bc){
        const ok = bc.hit>=Math.ceil(bc.total/2);
        h += `<div class="blocks">${bc.blocks.map(b=>{
          const cls = b.dir==='ok'?'good':(b.dir==='hoog'?'crit':'warn');
          return `<div class="blk ${cls}">
            <span class="bn">${bc.label && bc.total>1 ? 'blok '+b.n : 'blok'}</span>
            <span class="bh num">${b.hr}</span>
            <span class="bt tiny">${b.dir==='ok'?'in band':(b.dir==='hoog'?'+'+(b.hr-bc.hi)+' te hoog':(bc.lo-b.hr)+' te laag')}</span>
          </div>`;}).join('')}</div>`;
        if(!bc.found) h += `<div class="tiny muted" style="margin-top:5px">Blokken afgeleid uit de rondes van Strava; leg je ze niet handmatig vast, dan is de indeling een benadering.</div>`;
        h += `<div class="small" style="margin-top:7px;color:${ok?'var(--good-ink)':'var(--warn-ink)'}">
          ${ok?'✓':'!'} ${bc.hit} van ${bc.total} blokken binnen ${bc.lo}–${bc.hi} bpm${ok?'':' — te hoog betekent dat je weer richting drempel racet, en dat is precies de gewoonte die dit blok moet afleren'}</div>`;
        if(a.hr) h += `<div class="tiny muted" style="margin-top:5px">Hele sessie inclusief warming-up en herstel: ${Math.round(a.hr)} bpm gemiddeld.</div>`;
      } else if(a.hr){
        h += `<div class="small warnrow" style="margin-top:7px">Geen rondegegevens beschikbaar, dus de blokken zijn niet te beoordelen. Sessiegemiddelde was ${Math.round(a.hr)} bpm — dat zegt over een intervaltraining weinig.</div>`;
      }
    } else if(a.hr){
      h += `<div class="small sec" style="margin-top:4px">Gemiddelde hartslag <strong class="num" style="color:var(--text-primary)">${Math.round(a.hr)} bpm</strong></div>`;
    }
  }
  h += `</div>`;
  return h;
}

  h += `<section class="card"><h2>Dam tot Dam 2024 · waar het misging</h2>
    ${lineChart([{color:'var(--s2)', pts: d24.hr.map((v,i)=>({v, label:(i%3===0)?String(i+1):'', tip:`km ${i+1}: ${v} bpm, ${Math.floor(d24.pace[i]/60)}:${String(d24.pace[i]%60).padStart(2,'0')}/km`}))}],
      {h:150, min:150, max:190})}
    <p class="small sec" style="margin:8px 0 0">Vanaf km 13 <em>daalt</em> de hartslag (178 → 173) terwijl het tempo instort (4:42 → 4:58). Dalende hartslag bij dalend tempo is geen cardiovasculaire limiet maar spiervermoeidheid: hij liep 74 minuten op 98% van zijn drempel.</p>
  </section>`;
  return h;
};

  {id:'vandaag', label:'Vandaag', title:'Vandaag', icon:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>'},
  {id:'schema',  label:'Schema',  title:'Trainingsschema', icon:'<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18M8 15h3"/>'},
  {id:'voortgang',label:'Voortgang',title:'Voortgang', icon:'<path d="M4 19V5"/><path d="M4 15l5-5 4 3 7-8"/>'},
  {id:'jaar',    label:'Jaar',    title:'Jaaroverzicht', icon:'<path d="M12 21a9 9 0 1 0-9-9"/><path d="M12 7v5l4 2"/><path d="M3 12l3-2 2 3"/>'},
];
let tab = LS.get('tab','vandaag');

function render(){
  const t = TABS.find(x=>x.id===tab) || TABS[0];

  const dtd = dayDiff(DATA.race.date, TODAY_ISO);

const tt = document.getElementById('tt');
document.addEventListener('pointerover', e=>{

  tt.style.top = Math.max(r.top-40, 8)+'px';

}

      ${[['auto','Systeem'],['light','Licht'],['dark','Donker']].map(([v,l])=>

    <div class="note">Maak eenmalig een API-applicatie aan op <strong>strava.com/settings/api</strong>. Zet daar bij <em>Authorization Callback Domain</em> het domein van deze pagina: <strong class="num">${esc(location.hostname||'localhost')}</strong>. Kopieer daarna de Client ID en Client Secret hierheen.</div>

    <div class="note tiny">Je secret blijft in de opslag van deze browser en wordt alleen naar Strava zelf gestuurd. Dat is werkbaar voor een app die alleen jij gebruikt; ga je 'm delen, dan hoort de tokenwissel achter een eigen servertje.</div>
    <hr class="sep">
    <p class="tiny muted">Basisdata gegenereerd op ${DATA.generated} uit de Garmin-export van 9 augustus 2026 en Strava. Alle output is een startpunt, geen medisch advies.</p>
    <button class="btn ghost" data-close>Sluiten</button>`;
}
function wireSheet(kind){
  if(kind==='log'){
    document.getElementById('f-save').onclick = ()=>{
      const log = LS.get('log',{});
      log[TODAY_ISO] = {
        rhr: +document.getElementById('f-rhr').value||null,
        sleep: +document.getElementById('f-sleep').value||null,
        hrv: +document.getElementById('f-hrv').value||null,
        feel: document.getElementById('f-feel').value||null };
      LS.set('log',log); closeSheet(); render();
    };
    return;
  }
  panel.querySelectorAll('[data-theme-set]').forEach(b=> b.onclick = ()=>{
    const v=b.dataset.themeSet; LS.set('theme',v); applyTheme();
    panel.querySelectorAll('[data-theme-set]').forEach(x=>x.setAttribute('aria-pressed', x.dataset.themeSet===v));
  });
  const idEl=document.getElementById('s-id'), secEl=document.getElementById('s-secret');
  const conn=document.getElementById('s-connect');
  if(conn) conn.onclick = ()=>{
    const id=idEl.value.trim(), secret=secEl.value.trim();
    if(!id||!secret){ alert('Vul eerst Client ID en Client Secret in.'); return; }
    LS.set('strava', Object.assign(LS.get('strava',{}), {id, secret}));
    const redirect = location.origin+location.pathname;
    location.href = 'https://www.strava.com/oauth/authorize?client_id='+encodeURIComponent(id)+
      '&redirect_uri='+encodeURIComponent(redirect)+'&response_type=code&approval_prompt=auto&scope=activity:read_all';
  };
  const sync=document.getElementById('s-sync'); if(sync) sync.onclick = ()=>syncStrava(true);
  const clr=document.getElementById('s-clear'); if(clr) clr.onclick = ()=>{
    LS.del('strava'); LS.del('live'); closeSheet(); render();
  };
}
document.getElementById('settingsBtn').onclick = ()=>openSheet('settings');

/* ---------- theme ---------- */
function applyTheme(){
  const v = LS.get('theme','auto');
  document.documentElement.setAttribute('data-theme', v);
  render();
}

/* ---------- Strava live ---------- */
async function exchangeCode(code){
  const cfg = LS.get('strava',{});
  const r = await fetch('https://www.strava.com/oauth/token', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({client_id:cfg.id, client_secret:cfg.secret, code, grant_type:'authorization_code'})});
  if(!r.ok) throw new Error('Tokenaanvraag mislukt ('+r.status+')');
  const j = await r.json();
  LS.set('strava', Object.assign(cfg, {token:j.access_token, refresh:j.refresh_token, exp:j.expires_at}));
}
async function freshToken(){
  const cfg = LS.get('strava',{});
  if(!cfg.token) return null;
  if(cfg.exp && cfg.exp*1000 > Date.now()+6e4) return cfg.token;
  const r = await fetch('https://www.strava.com/oauth/token', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({client_id:cfg.id, client_secret:cfg.secret, refresh_token:cfg.refresh, grant_type:'refresh_token'})});
  if(!r.ok) return null;
  const j = await r.json();
  LS.set('strava', Object.assign(cfg, {token:j.access_token, refresh:j.refresh_token, exp:j.expires_at}));
  return j.access_token;
}
/* De activiteitenlijst van Strava bevat geen rondes. Zonder die rondes is er geen
   hartslagdrift en geen blokcontrole, dus worden ze per nieuwe hardloopsessie apart
   opgehaald en lokaal bewaard. Maximaal 20 per sync — Strava staat 100 verzoeken
   per kwartier toe. */
async function syncLaps(token, acts){
  const store = LS.get('laps', {});
  const seeded = new Set(DATA.activities.filter(a=>a.laps).map(a=>a.id));
  const todo = acts.filter(a=>a.sport==='Run' && !store[a.id] && !seeded.has(a.id)).slice(0,20);
  let got = 0;
  for(const a of todo){
    try{
      const r = await fetch('https://www.strava.com/api/v3/activities/'+a.id+'/laps',
        {headers:{Authorization:'Bearer '+token}});
      if(r.status===429){ break; }          // limiet bereikt, volgende sync verder
      if(!r.ok){ store[a.id] = []; continue; }  // geen rondes: niet blijven proberen
      const j = await r.json();
      store[a.id] = j.map(l=>({t:l.elapsed_time, d:Math.round(l.distance),
        hr:l.average_heartrate!=null?Math.round(l.average_heartrate*10)/10:null}))
        .filter(l=>l.hr!=null);
      got++;
    }catch(e){ break; }
  }
  LS.set('laps', store);
  return got;
}

async function syncStrava(loud){
  const token = await freshToken();
  if(!token){ if(loud) alert('Geen geldige koppeling. Koppel opnieuw.'); return; }
  const after = Math.floor(new Date(DATA.generated+'T00:00:00').getTime()/1000) - 86400*3;
  try{
    const r = await fetch('https://www.strava.com/api/v3/athlete/activities?per_page=100&after='+after,
      {headers:{Authorization:'Bearer '+token}});
    if(!r.ok) throw new Error('Strava gaf '+r.status);
    const j = await r.json();
    const mapped = j.map(a=>({
      id:String(a.id), name:a.name, sport:a.sport_type||a.type,
      date:(a.start_date_local||'').slice(0,10), time:(a.start_date_local||'').slice(11,16),
      dist_m:a.distance, moving_s:a.moving_time, elev_m:a.total_elevation_gain,
      avg_ms:a.average_speed, max_ms:a.max_speed, effort:a.suffer_score||null,
      kcal:a.calories||null, cadence:a.average_cadence||null,
      hr:a.average_heartrate||null, hrmax:a.max_heartrate||null, desc:a.description||undefined
    })).filter(a=>a.date>='2026-01-01');
    LS.set('live', mapped); LS.set('synced', new Date().toISOString());
    if(loud){ closeSheet(); }
    render();
    const n = await syncLaps(token, mapped);
    if(n) render();
    if(loud) setTimeout(()=>alert(mapped.length+' activiteiten opgehaald'+(n?', met de rondes van '+n+' nieuwe loop'+(n===1?'':'jes'):'')+'.'),100);
  }catch(err){ if(loud) alert('Synchroniseren mislukt: '+err.message); }
}

/* ---------- boot ---------- */
(async function(){
  document.documentElement.setAttribute('data-theme', LS.get('theme','auto'));
  const q = new URLSearchParams(location.search);
  if(q.get('code')){
    try{ await exchangeCode(q.get('code')); history.replaceState({},'',location.pathname); await syncStrava(false); }
    catch(err){ history.replaceState({},'',location.pathname); alert('Koppelen mislukt: '+err.message); }
  }
  render();
  if(LS.get('strava',{}).token) syncStrava(false);
})();

/* service worker: cache de app zelf zodat hij offline opent */
if('serviceWorker' in navigator && location.protocol==='https:'){
  const sw = `const C='pt-v1';
  self.addEventListener('install',e=>{self.skipWaiting();e.waitUntil(caches.open(C).then(c=>c.add('./')))});
  self.addEventListener('activate',e=>e.waitUntil(self.clients.claim()));
  self.addEventListener('fetch',e=>{
    if(e.request.method!=='GET'||new URL(e.request.url).origin!==location.origin) return;
    e.respondWith(fetch(e.request).then(r=>{const cl=r.clone();caches.open(C).then(c=>c.put(e.request,cl));return r})
      .catch(()=>caches.match(e.request).then(r=>r||caches.match('./'))));
  });`;
  navigator.serviceWorker.register(URL.createObjectURL(new Blob([sw],{type:'text/javascript'})),{scope:'./'}).catch(()=>{});
}
